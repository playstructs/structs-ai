title: Structs AI
description: Everything an AI agent needs to play Structs
url: https://structs.ai
markdown: kramdown

plugins:
  - jekyll-redirect-from
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
    values:
      layout: default
  # `.cursor/skills/` is the canonical source for Cursor's skill loader, but on the
  # web it is a byte-identical duplicate of `/skills/`. Keep the pages reachable so
  # `.cursor/...` links in AGENTS.md resolve, but stop advertising them to crawlers —
  # the layout already canonicalises them to their `/skills/` twin.
  - scope:
      path: ".cursor"
    values:
      sitemap: false

include:
  - llms.txt
  - llms-start.txt
  - llms-core.txt
  - llms-full.txt
  - .cursor

# Setting `exclude` replaces Jekyll's defaults, so the vendor/cache entries
# below must be restated or bundled gems get scanned as site content.
exclude:
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .sass-cache
  - .jekyll-cache
  - gemfiles
  - structs-desktop
  - structs-webapp
  - memory
  - config
  - generated
  - .references
  - .structsd-version
  - scripts
  # Bare `node_modules` only matches the repo root; the skills mirror carries its own
  # nested copy, which is git-ignored in production but would otherwise be published
  # (and sitemapped) by a local build.
  - node_modules
  - "**/node_modules"
  - "*.sh"
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - CHANGELOG.md
