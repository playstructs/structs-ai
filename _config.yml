title: Structs AI
description: Everything an AI agent needs to play Structs
url: https://structs.ai
markdown: kramdown

plugins:
  - jekyll-redirect-from
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
    values:
      layout: default

include:
  - llms.txt
  - llms-start.txt
  - llms-core.txt
  - llms-full.txt
  - .cursor

# Setting `exclude` replaces Jekyll's defaults, so the vendor/cache entries
# below must be restated or bundled gems get scanned as site content.
exclude:
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .sass-cache
  - .jekyll-cache
  - gemfiles
  - structs-desktop
  - structs-webapp
  - memory
  - config
  - generated
  - .references
  - .structsd-version
  - scripts
  - node_modules
  - "*.sh"
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - CHANGELOG.md
