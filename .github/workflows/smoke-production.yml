name: Production smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

jobs:
  smoke:
    name: Live structs.ai smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke production
        run: bash scripts/ci/smoke-production.sh
