name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Structure & truth checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean-clone smoke test
        run: bash scripts/smoke-test.sh

      - name: Skills mirror in sync
        run: bash scripts/ci/check-skills-mirror.sh

      - name: Command-name lint (deprecated tokens = hard gate)
        run: bash scripts/ci/lint-commands.sh

      - name: Invocation lint (arity, `--` order, --gas auto)
        run: python3 scripts/ci/check-invocations.py

      - name: Internal link check
        run: bash scripts/ci/check-links.sh

      - name: Situation playbooks wired into bootstrap routers
        run: bash scripts/ci/check-situations-routers.sh

      - name: Generated bundle drift
        run: bash scripts/ci/check-bundles.sh

  jekyll:
    name: Jekyll build (with redirects)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: OG image drift
        run: |
          python3 -m pip install pillow
          python3 scripts/generate-og-images.py --check
      - name: Build site
        env:
          # Liquid 4.0.3 calls String#tainted?, removed in Ruby 3.2. See
          # scripts/ci/ruby-taint-compat.rb.
          RUBYOPT: "-r${{ github.workspace }}/scripts/ci/ruby-taint-compat"
        run: bundle exec jekyll build --trace
      - name: Metadata gate
        run: python3 scripts/ci/check-metadata.py
